 @if(card.isAcquired){
   <ion-icon class="acquired" name="checkmark-circle"></ion-icon>
 }

 <ion-card> 
   <ion-card-header>
      <div class="card-title-wrapper ion-align-items-center ion-align-content-center">
         <ion-card-title class="ion-text-center">
            {{ card.name }}
         </ion-card-title> 
      </div>
     
      <div>
         @if (card.srcPicture) {
            <img class="card-image" [alt]="card.name" [src]="getSrc(card.srcPicture)"/>
         }
      </div>
   </ion-card-header>

   <ion-card-content select="[body]">
      <div class="serie-logo">
         <ion-thumbnail>
            <img [src]="'../../../../' + card.serie.srcLogo" alt=""/>
         </ion-thumbnail>
      </div>

      <ng-content></ng-content>
   </ion-card-content>
</ion-card>
