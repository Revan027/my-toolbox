  <ion-modal #modal class="modal-filters" trigger="btn-modal-filters" [initialBreakpoint]="0.37" [breakpoints]="[0, 0.25, 0.5, 0.75]">
    <ng-template>
        <ion-content>        
            <ion-title class="ion-margin ion-text-center"> Filtrer </ion-title>   

            <form [formGroup]="formGroup" novalidate>
                <ion-input label="Rechercher" formControlName="searchText" label-placement="stacked" fill="outline"></ion-input>

                <ion-grid class="filter-generation">
                    <ion-row>
                        @for (item of generations; track item.id) 
                        {
                            <ion-col>
                                <ion-button size="small" [color]="initGenerationColor(item.id)" (click)="onGenerationChanged(item.id, $event)">{{item.libelle}}</ion-button>
                            </ion-col>
                        } 
                        @empty {
                            <ion-col>
                                <ion-text color="danger">Problème au chargement des générations</ion-text>
                            </ion-col>
                        }
                    </ion-row>
                </ion-grid>

                <div class="ion-margin ion-text-end">
                    <ion-button (click)="onSubmit(formGroup.value)" color="primary" [strong]="true" [disabled]="formGroup.invalid">Filtrer</ion-button>
                </div>
            </form> 
        </ion-content>
    </ng-template>
</ion-modal>
