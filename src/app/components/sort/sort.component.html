<ion-modal #modal class="modal-sorts" trigger="btn-modal-sorts" [initialBreakpoint]="0.3" [breakpoints]="[0, 0.25, 0.5, 0.75]">
    <ng-template>
        <ion-content>        
            <form [formGroup]="formGroup" novalidate>
                <ion-title class="ion-margin ion-text-center "> Trier </ion-title>
          
                <div class="ion-display-flex ion-justify-content-between ion-margin-top ion-margin-bottom">
                    <ion-toggle formControlName="generationAscending">Par génération Asc</ion-toggle>
                </div> 

                <div class="ion-display-flex ion-justify-content-between ion-margin-top ion-margin-bottom">
                    <ion-toggle formControlName="nameAscending">Par nom Asc</ion-toggle>
                </div>    
                                     
                <div class="ion-margin ion-text-end">
                    <ion-button (click)="onSubmit(formGroup.value)" color="primary" [strong]="true" [disabled]="formGroup.invalid">Trier</ion-button>
                </div>
            </form>    
        </ion-content>
    </ng-template>
</ion-modal>
