<ion-header [translucent]="true">
   <ion-toolbar>
      <div class="header-content">
         <div class="hearder-icon">
           <ion-icon name="server-outline"></ion-icon>
         </div>

        <div class="header-text">
            <span class="header-title">Backup</span> 
         
            <span class="header-description">
               Sauvegarder les données
            </span> 
         </div>              
      </div>
   </ion-toolbar>  
</ion-header>

<ion-content class="ion-padding-top" [fullscreen]="true">
   <ion-row class="ion-align-items-center">
      <ion-col>     
         <div class="ion-text-center">
            <input #inputFile type="file" hidden  (change)="import($event)" />

            <ion-button (click)="export()" [strong]="true" class="button--main">
               <ion-icon slot="start" name="download-outline"></ion-icon>
               <ion-spinner [class]="showExportSpinner ? 'ion-margin-end' : 'd-none'" name="dots"></ion-spinner> 
               Exporter la base
            </ion-button>

            <ion-button (click)="openFileSelector()" [strong]="true" class="button--main">
               <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
               <ion-spinner [class]="showImportSpinner ? 'ion-margin-end' : 'd-none'" name="dots"></ion-spinner> 
               Importer une sauvegarde
            </ion-button>
         </div>
      </ion-col>
   </ion-row>
</ion-content>
