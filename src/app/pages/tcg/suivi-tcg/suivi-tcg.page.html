<ion-header [translucent]="true">
   <ion-toolbar>
      <ion-title>
         <div class="header-title">
            <ion-icon name="albums-outline"></ion-icon>
            <span>Suivi Collection TCG</span>
         </div>
      </ion-title>

      <ion-buttons slot="end">
         <ion-fab-button class="btn-add" size="small" [routerLink]="['creation']" routerDirection="forward" [routerAnimation]="slideForward">
            <ion-icon name="add"></ion-icon>
         </ion-fab-button>
      </ion-buttons>
   </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding-top">
   <ion-fab slot="fixed" horizontal="end" vertical="bottom">
      <ion-fab-button class="btn-filters" size="small" id="btn-modal-filters" expand="block">
         <ion-icon size="small" name="filter-outline"></ion-icon>
      </ion-fab-button>

      <ion-fab-button class="btn-sorts" size="small"id="btn-modal-sorts" expand="block">
         <ion-icon  size="small" name="swap-vertical-outline"></ion-icon> 
      </ion-fab-button>   
   </ion-fab>

   <app-dashboard></app-dashboard>

   @if(!loaded){
   
      <!-- Barre de résumé de recherche : résultats · valeur · complétion (données de test) -->
      @if(this.pagedCardResult().cards.length > 0){
        <div style="
          display: flex;
          align-items: stretch;
          background: var(--app-card-bg);
          border-radius: var(--app-card-radius);
          box-shadow: var(--app-card-shadow);
          padding: 8px 4px;
          margin-bottom: 12px;
        ">
          <!-- Résultats -->
          <div style="flex: 1; text-align: center; padding: 0 6px;">
            <p style="margin: 0; font-size: var(--ion-font-size-base); font-weight: 800; color: var(--app-text-color);">71</p>
            <span style="font-size: 11px; color: var(--app-text-muted);">résultats</span>
          </div>

          <div style="width: 1px; background: var(--app-border-color, #e0e0e0); margin: 4px 0;"></div>

          <!-- Valeur -->
          <div style="flex: 1; text-align: center; padding: 0 6px;">
            <p style="margin: 0; font-size: var(--ion-font-size-base); font-weight: 800; color: var(--app-text-color);">259,40 €</p>
            <span style="font-size: 11px; color: var(--app-text-muted);">valeur</span>
          </div>

          <div style="width: 1px; background: var(--app-border-color, #e0e0e0); margin: 4px 0;"></div>

          <!-- Complétion -->
          <div style="flex: 1; text-align: center; padding: 0 6px;">
            <p style="margin: 0; font-size: var(--ion-font-size-base); font-weight: 800; color: #7c3aed;">79 %</p>
            <span style="font-size: 11px; color: var(--app-text-muted);">complétion</span>
          </div>
        </div>
      }

      <ion-grid class="grid-cards ion-margin-bottom">
         <ion-row>
            @for (item of pagedCardResult().cards; track item.id) 
            {
               <ion-col size="4">
                  <app-card [card]="item" [routerLink]="['detail', item.id]" routerDirection="forward" [routerAnimation]="slideForward">
                     <!-- <p body>Injecte du contenu dans la partie body du composant</p> -->
                  </app-card>
               </ion-col>
            } 
            @empty {
               <ion-col>
                  <ion-text color="info">Aucune cartes trouvées</ion-text>
               </ion-col>
            }
         </ion-row>
      </ion-grid>  

      <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)" [disabled]="pagedCardResult().isFinished">
         <ion-infinite-scroll-content loadingText="Chargement..." loadingSpinner="dots"></ion-infinite-scroll-content>
      </ion-infinite-scroll>    
   } 
   @else{
      <div class="loader-center">
         <ion-spinner name="dots"></ion-spinner>
      </div>
   }

   <app-filter></app-filter>
      
   <app-sort></app-sort>
</ion-content>
