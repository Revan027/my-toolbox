<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background circle -->
  <circle cx="512" cy="512" r="512" fill="#1b2a3b"/>

  <!-- Toolbox body -->
  <rect x="220" y="480" width="584" height="320" rx="30" ry="30" fill="#e67e22"/>
  <rect x="220" y="480" width="584" height="320" rx="30" ry="30" fill="none" stroke="#d35400" stroke-width="10"/>

  <!-- Toolbox top panel -->
  <rect x="220" y="430" width="584" height="80" rx="20" ry="20" fill="#f39c12"/>
  <rect x="220" y="430" width="584" height="80" rx="20" ry="20" fill="none" stroke="#d35400" stroke-width="10"/>

  <!-- Handle -->
  <path d="M390 430 Q390 340 512 340 Q634 340 634 430" fill="none" stroke="#f39c12" stroke-width="28" stroke-linecap="round"/>

  <!-- Center latch -->
  <rect x="457" y="455" width="110" height="38" rx="10" ry="10" fill="#2c3e50"/>
  <circle cx="512" cy="474" r="14" fill="#95a5a6"/>
  <circle cx="512" cy="474" r="7" fill="#2c3e50"/>

  <!-- Horizontal divider line -->
  <line x1="220" y1="640" x2="804" y2="640" stroke="#d35400" stroke-width="8"/>

  <!-- Tool 1: Wrench (left) -->
  <g transform="translate(310, 555) rotate(-30)">
    <rect x="-14" y="-55" width="28" height="100" rx="8" fill="#ecf0f1"/>
    <ellipse cx="0" cy="-55" rx="22" ry="18" fill="#ecf0f1"/>
    <ellipse cx="0" cy="-55" rx="10" ry="8" fill="#1b2a3b"/>
  </g>

  <!-- Tool 2: Screwdriver (center-left) -->
  <g transform="translate(440, 560) rotate(10)">
    <rect x="-8" y="-70" width="16" height="90" rx="4" fill="#3498db"/>
    <rect x="-10" y="18" width="20" height="30" rx="3" fill="#ecf0f1"/>
    <rect x="-3" y="-75" width="6" height="20" rx="2" fill="#95a5a6"/>
  </g>

  <!-- Tool 3: Hammer (center-right) -->
  <g transform="translate(590, 560) rotate(-10)">
    <rect x="-6" y="-20" width="12" height="90" rx="4" fill="#795548"/>
    <rect x="-22" y="-50" width="50" height="28" rx="6" fill="#607d8b"/>
  </g>

  <!-- Tool 4: Pliers (right) -->
  <g transform="translate(710, 555) rotate(20)">
    <rect x="-10" y="-60" width="10" height="80" rx="4" fill="#95a5a6"/>
    <rect x="0" y="-60" width="10" height="80" rx="4" fill="#7f8c8d"/>
    <ellipse cx="0" cy="-60" rx="14" ry="10" fill="#7f8c8d"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="180" cy="300" r="8" fill="#f39c12" opacity="0.6"/>
  <circle cx="850" cy="280" r="6" fill="#f39c12" opacity="0.5"/>
  <circle cx="160" cy="750" r="5" fill="#f39c12" opacity="0.4"/>
  <circle cx="870" cy="770" r="7" fill="#f39c12" opacity="0.5"/>

  <!-- App name -->
  <text x="512" y="890"
        font-family="Arial, sans-serif"
        font-size="68"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        opacity="0.9">MyToolbox</text>
</svg>
